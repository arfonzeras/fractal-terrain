<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fractal-terrain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e0c;
    --panel: rgba(10,14,12,0.82);
    --ink: #eef2ee;
    --ink-dim: rgba(238,242,238,0.62);
    --accent: #6fce8a;
    --border: rgba(238,242,238,0.14);
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing: inherit; }
  html,body{ height:100%; margin:0; background:var(--bg); overflow:hidden;
    font-family:'Space Grotesk', ui-sans-serif, system-ui, sans-serif; color:var(--ink); }
  #canvas-holder{ position:fixed; inset:0; }
  canvas{ display:block; touch-action:none; }

  #panel{
    position:fixed;
    top: max(18px, env(safe-area-inset-top,0px));
    left: max(18px, env(safe-area-inset-left,0px));
    width: 300px;
    max-width: calc(100vw - 36px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    backdrop-filter: blur(10px);
    max-height: calc(100vh - 36px);
    overflow-y: auto;
  }
  #panel h1{ font-size: 16px; font-weight: 600; margin: 0 0 2px; letter-spacing: -0.01em; }
  #panel .sub{ font-size: 12px; color: var(--ink-dim); margin: 0 0 14px; line-height: 1.5; }
  #panel .sub a{ color: var(--accent); }
  label{ display:block; font-size: 11px; color: var(--ink-dim); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  select, input{
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: var(--ink); border-radius: 6px; padding: 7px 8px; font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
  }
  select:focus, input:focus{ outline: 1px solid var(--accent); }
  .row{ display:flex; gap: 8px; }
  .row > div{ flex:1; }
  #formulaDesc{ font-size: 11.5px; color: var(--ink-dim); margin-top: 6px; line-height: 1.5; min-height: 32px; }
  button{
    font-family: inherit; font-size: 13px; border-radius: 6px; padding: 9px 12px;
    cursor: pointer; border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: var(--ink);
    transition: background 0.15s ease;
  }
  button:hover{ background: rgba(255,255,255,0.12); }
  #generate{ width:100%; margin-top: 14px; background: var(--accent); color: #0a1a0f; border: none; font-weight: 600; }
  #generate:hover{ background: #85dc9e; }
  #generate:disabled{ opacity: 0.5; cursor: default; }
  #download{ width:100%; margin-top: 8px; }
  #stats{
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-dim);
    white-space: pre-line; line-height: 1.6;
  }
  #repoLink{ display:block; margin-top: 12px; font-size: 11.5px; color: var(--ink-dim); }
  #repoLink a{ color: var(--accent); }
  #hint{ position:fixed; bottom: max(16px, env(safe-area-inset-bottom,0px)); right: max(18px, env(safe-area-inset-right,0px));
    font-size: 11.5px; color: var(--ink-dim); text-shadow: 0 1px 4px rgba(0,0,0,0.6); }

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){ --bg:#0a0e0c; --ink:#eef2ee; }
  }
</style>
</head>
<body>
<div id="canvas-holder"></div>

<div id="panel">
  <h1>fractal-terrain</h1>
  <p class="sub">Generated live in your browser — same code as the CLI. <a href="https://github.com/arfonzeras/fractal-terrain" target="_blank" rel="noopener">Source & docs on GitHub</a></p>

  <label for="formula">Formula</label>
  <select id="formula"></select>
  <div id="formulaDesc"></div>

  <label>c (complex parameter)</label>
  <div class="row">
    <div><input id="cx" type="number" step="0.01"></div>
    <div><input id="cy" type="number" step="0.01"></div>
  </div>

  <label for="resolution">Resolution</label>
  <select id="resolution">
    <option value="48">48 (fast)</option>
    <option value="80">80</option>
    <option value="128" selected>128 (default)</option>
    <option value="180">180 (slow)</option>
  </select>

  <button id="generate">Generate</button>
  <button id="download" disabled>Download .gltf</button>

  <div id="stats">—</div>
  <div id="repoLink">All 18 formulas ship verified — see the <a href="https://github.com/arfonzeras/fractal-terrain#formulas-that-ship" target="_blank" rel="noopener">caveats tables</a> before trusting one blindly.</div>
</div>

<div id="hint">Drag to orbit, scroll to zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="site/formulas.gen.js"></script>
<script src="site/lib.gen.js"></script>
<script>
(function(){
  'use strict';

  // ---------- Scene ----------
  var holder = document.getElementById('canvas-holder');
  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0e0c, 0.035);

  var camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.1, 200);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x0a0e0c, 1);
  holder.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xbfe8c9, 0x0a1a0f, 0.7));
  var sun = new THREE.DirectionalLight(0xfffbea, 1.1);
  sun.position.set(4,6,2);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0x6fce8a, 0.3);
  fill.position.set(-5,2,-3);
  scene.add(fill);

  var target = new THREE.Vector3(0,0.5,0);
  var radius = 8, theta = Math.PI*0.22, phi = Math.PI*0.32;
  function updateCamera(){
    var sp = Math.sin(phi);
    camera.position.set(target.x+radius*sp*Math.sin(theta), target.y+radius*Math.cos(phi), target.z+radius*sp*Math.cos(theta));
    camera.lookAt(target);
  }
  updateCamera();

  var dragging=false, lastX=0, lastY=0, userInteracted=false;
  var hintEl = document.getElementById('hint');
  function markInteracted(){ if(!userInteracted){ userInteracted=true; hintEl.style.opacity='0'; } }
  renderer.domElement.addEventListener('pointerdown', function(e){ dragging=true; lastX=e.clientX; lastY=e.clientY; markInteracted(); });
  window.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
    theta -= dx*0.006; phi = Math.min(Math.PI*0.49, Math.max(0.08, phi - dy*0.005));
    updateCamera();
  });
  window.addEventListener('pointerup', function(){ dragging=false; });
  renderer.domElement.addEventListener('wheel', function(e){
    e.preventDefault(); markInteracted();
    radius = Math.min(40, Math.max(2, radius*Math.exp(e.deltaY*0.001)));
    updateCamera();
  }, { passive:false });
  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    var dt = clock.getDelta();
    if(!userInteracted && !dragging){ theta += dt*0.03; updateCamera(); }
    renderer.render(scene, camera);
  }
  animate();

  // ---------- UI wiring ----------
  var formulaSel = document.getElementById('formula');
  var descEl = document.getElementById('formulaDesc');
  var cxInput = document.getElementById('cx');
  var cyInput = document.getElementById('cy');
  var resSel = document.getElementById('resolution');
  var genBtn = document.getElementById('generate');
  var dlBtn = document.getElementById('download');
  var statsEl = document.getElementById('stats');

  var categoryOrder = ['Julia-native', 'Adapted from Mandelbrot', 'Simplified (convergence, not escape-time)'];
  var names = Object.keys(window.FORMULAS).sort();
  var byCategory = {};
  names.forEach(function(n){
    var cat = window.FORMULAS[n].category || 'Other';
    (byCategory[cat] = byCategory[cat] || []).push(n);
  });
  var orderedCats = categoryOrder.filter(function(c){ return byCategory[c]; })
    .concat(Object.keys(byCategory).filter(function(c){ return categoryOrder.indexOf(c) === -1; }));
  orderedCats.forEach(function(cat){
    var group = document.createElement('optgroup');
    group.label = cat;
    byCategory[cat].forEach(function(n){
      var opt = document.createElement('option');
      opt.value = n; opt.textContent = n;
      group.appendChild(opt);
    });
    formulaSel.appendChild(group);
  });

  function applyFormulaDefaults(){
    var f = window.FORMULAS[formulaSel.value];
    descEl.textContent = f.description;
    cxInput.value = f.defaultC[0];
    cyInput.value = f.defaultC[1];
  }
  formulaSel.addEventListener('change', applyFormulaDefaults);
  formulaSel.value = 'pickover-biomorph';
  applyFormulaDefaults();

  var currentMesh = null; // raw {positions,colors,indices} for download
  var terrainObj = null;

  function generate(){
    genBtn.disabled = true;
    genBtn.textContent = 'Generating…';
    // rAF so the button label actually repaints before the (synchronous,
    // can take a moment at high resolution) computation blocks the thread
    requestAnimationFrame(function(){
      try {
        var f = window.FORMULAS[formulaSel.value];
        var c = [parseFloat(cxInput.value), parseFloat(cyInput.value)];
        var domainHalf = f.defaultDomainHalf;
        var resolution = parseInt(resSel.value, 10);

        var t0 = performance.now();
        var cal = window.calibrate({ iterate: f.iterate, c: c, domainHalf: domainHalf });
        var mesh = window.buildMesh({
          iterate: f.iterate, c: c, domainHalf: domainHalf, resolution: resolution,
          gamma: cal.gamma, fieldMax: cal.fieldMax
        });
        var ms = (performance.now()-t0).toFixed(0);

        if (terrainObj){ scene.remove(terrainObj); terrainObj.geometry.dispose(); terrainObj.material.dispose(); }
        var geo = new THREE.BufferGeometry();
        geo.setIndex(mesh.indices);
        geo.setAttribute('position', new THREE.BufferAttribute(mesh.positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(mesh.colors, 3));
        geo.computeVertexNormals();
        var mat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.85, side: THREE.DoubleSide });
        terrainObj = new THREE.Mesh(geo, mat);
        scene.add(terrainObj);

        var heightScale = 1.6;
        target.set(0, heightScale*0.32, 0);
        updateCamera();

        currentMesh = mesh;
        dlBtn.disabled = false;
        statsEl.textContent = [
          'vertices: ' + (mesh.positions.length/3),
          'triangles: ' + (mesh.indices.length/3),
          'gamma: ' + cal.gamma + '  fieldMax: ' + cal.fieldMax.toFixed(3),
          'generated in ' + ms + ' ms'
        ].join('\n');
      } catch (err) {
        statsEl.textContent = 'Error: ' + err.message;
        console.error(err);
      }
      genBtn.disabled = false;
      genBtn.textContent = 'Generate';
    });
  }
  genBtn.addEventListener('click', generate);
  generate(); // initial render on load

  // ---------- Browser-side glTF export (same layout as lib/export.js,
  // ported from Node Buffer/fs to Blob/ArrayBuffer) ----------
  function downloadGLTF(){
    if (!currentMesh) return;
    var positions = currentMesh.positions, colors = currentMesh.colors, indices = currentMesh.indices;
    var vertCount = positions.length/3;
    var idxArray = new Uint32Array(indices);

    var minX=Infinity,minY=Infinity,minZ=Infinity,maxX=-Infinity,maxY=-Infinity,maxZ=-Infinity;
    for (var i=0;i<positions.length;i+=3){
      var x=positions[i], y=positions[i+1], z=positions[i+2];
      if(x<minX)minX=x; if(x>maxX)maxX=x;
      if(y<minY)minY=y; if(y>maxY)maxY=y;
      if(z<minZ)minZ=z; if(z>maxZ)maxZ=z;
    }

    var posBytes = new Uint8Array(positions.buffer.slice(positions.byteOffset, positions.byteOffset+positions.byteLength));
    var colBytes = new Uint8Array(colors.buffer.slice(colors.byteOffset, colors.byteOffset+colors.byteLength));
    var idxBytes = new Uint8Array(idxArray.buffer);
    var totalLen = posBytes.length + colBytes.length + idxBytes.length;
    var bin = new Uint8Array(totalLen);
    bin.set(posBytes, 0);
    bin.set(colBytes, posBytes.length);
    bin.set(idxBytes, posBytes.length + colBytes.length);

    var name = formulaSel.value + '-' + cxInput.value + '-' + cyInput.value;
    var gltf = {
      asset: { version: '2.0', generator: 'fractal-terrain (browser)' },
      scene: 0, scenes: [{ nodes:[0] }],
      nodes: [{ mesh:0, name:name }],
      meshes: [{ name:name, primitives:[{ attributes:{POSITION:0,COLOR_0:1}, indices:2, mode:4 }] }],
      buffers: [{ uri: name+'.bin', byteLength: bin.length }],
      bufferViews: [
        { buffer:0, byteOffset:0, byteLength:posBytes.length, target:34962 },
        { buffer:0, byteOffset:posBytes.length, byteLength:colBytes.length, target:34962 },
        { buffer:0, byteOffset:posBytes.length+colBytes.length, byteLength:idxBytes.length, target:34963 }
      ],
      accessors: [
        { bufferView:0, componentType:5126, count:vertCount, type:'VEC3', min:[minX,minY,minZ], max:[maxX,maxY,maxZ] },
        { bufferView:1, componentType:5126, count:vertCount, type:'VEC3' },
        { bufferView:2, componentType:5125, count:idxArray.length, type:'SCALAR' }
      ]
    };

    function saveBlob(blob, filename){
      var a = document.createElement('a');
      var url = URL.createObjectURL(blob);
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    saveBlob(new Blob([JSON.stringify(gltf, null, 2)], {type:'model/gltf+json'}), name+'.gltf');
    saveBlob(new Blob([bin], {type:'application/octet-stream'}), name+'.bin');
  }
  dlBtn.addEventListener('click', downloadGLTF);
})();
</script>
</body>
</html>
